<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloAnto — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #1a1a2e;
      --cream:  #f5f0e8;
      --gold:   #c9a84c;
      --sage:   #4a7c59;
      --error:  #c0392b;
      --radius: 4px;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse at 20% 80%, rgba(74,124,89,.12) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 10%, rgba(201,168,76,.10) 0%, transparent 50%);
      font-family: 'DM Sans', sans-serif;
    }

    /* noise grain overlay */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      background-size: 180px;
      opacity: .6;
    }

    .card {
      position: relative; z-index: 1;
      width: min(420px, 92vw);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(201,168,76,.25);
      border-radius: 16px;
      padding: 52px 44px 44px;
      box-shadow: 0 20px 60px rgba(26,26,46,.08), 0 4px 16px rgba(26,26,46,.04);
      animation: rise .55s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes rise {
      from { opacity:0; transform: translateY(24px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--ink);
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .brand em { font-style: italic; color: var(--sage); }

    .subtitle {
      font-size: .85rem;
      color: #888;
      font-weight: 300;
      margin-bottom: 36px;
      letter-spacing: .02em;
    }

    label {
      display: block;
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #ddd;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      background: #fafafa;
      color: var(--ink);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(74,124,89,.12);
      background: #fff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      background: var(--ink);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: .04em;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    button:hover  { background: #2e2e50; }
    button:active { transform: scale(.98); }

    #msg {
      margin-top: 14px;
      font-size: .85rem;
      color: var(--error);
      min-height: 1.2em;
      text-align: center;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,.4), transparent);
      margin: 28px 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Hello<em>Anto</em></div>
    <div class="subtitle">Tableau de bord personnel</div>

    <label for="email">Adresse e-mail</label>
    <input type="email" id="email" placeholder="votre@email.com" autocomplete="email">

    <label for="pass">Mot de passe</label>
    <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">

    <button onclick="login()">Se connecter</button>
    <p id="msg"></p>
    <div class="divider"></div>
  </div>

  <script>
    function login() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pass').value;
      const msg   = document.getElementById('msg');

      // Vérification des deux comptes autorisés
      const compte1 = (email === 'antoinengn45@gmail.com' && pass === 'antoine21');
      const compte2 = (email === 'thingochan45140@gmail.com' && pass === 'han86');

      if (compte1 || compte2) {
        msg.style.color = '#27ae60';
        msg.textContent = 'Connexion réussie…';
        setTimeout(() => window.location.href = 'dashboard.html', 600);
      } else {
        msg.style.color = 'var(--error)';
        msg.textContent = 'Identifiants incorrects, veuillez réessayer.';
        document.getElementById('pass').value = '';
        document.getElementById('pass').focus();
      }
    }

    // Connexion via la touche Entrée
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
