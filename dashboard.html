<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelloAnto — Tableau de bord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
      // window.location.href = 'index.html';
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f0f11;
      --surface:    #17171b;
      --surface-2:  #1e1e24;
      --border:     rgba(255,255,255,.07);
      --border-h:   rgba(255,255,255,.13);
      --text:       #e8e8f0;
      --muted:      #6b6b80;
      --gold:       #d4a843;
      --red:        #e05c5c;
      --red-pale:   rgba(224,92,92,.10);
      --green:      #4caf7d;
      --green-pale: rgba(76,175,125,.10);
      --radius:     10px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 40px 24px 80px;
      background-image:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(212,168,67,.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(76,175,125,.05) 0%, transparent 55%);
    }
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    .wrapper { max-width: 900px; margin: 0 auto; }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; margin-bottom: 48px;
      animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    .brand { font-size: 1.75rem; font-weight: 800; letter-spacing: -.03em; }
    .brand em { font-style: normal; color: var(--gold); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .date-pill {
      font-size: .7rem; font-weight: 500; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 99px; padding: 7px 16px;
    }
    .logout-btn {
      font-family: 'Syne', sans-serif; font-size: .7rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
      background: none; border: 1px solid var(--border); border-radius: 99px;
      padding: 7px 16px; cursor: pointer; transition: color .2s, border-color .2s;
    }
    .logout-btn:hover { color: var(--red); border-color: rgba(224,92,92,.3); }

    /* ── KPI STRIP ── */
    .summary {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 28px;
      animation: fadeUp .5s .07s cubic-bezier(.22,1,.36,1) both;
    }
    @media (max-width: 640px) { .summary { grid-template-columns: repeat(2, 1fr); } }
    .kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 20px 18px;
      position: relative; overflow: hidden; transition: border-color .2s;
    }
    .kpi:hover { border-color: var(--border-h); }
    .kpi::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px; border-radius: 2px 2px 0 0;
      background: var(--accent, var(--gold)); opacity: .6;
    }
    .kpi.k-debit  { --accent: var(--red); }
    .kpi.k-credit { --accent: var(--green); }
    .kpi.k-count  { --accent: var(--muted); }
    .kpi-label {
      font-size: .65rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .kpi-value {
      font-family: 'IBM Plex Mono', monospace; font-size: 1.3rem;
      font-weight: 500; white-space: nowrap;
    }
    .kpi-value.gold  { color: var(--gold); }
    .kpi-value.red   { color: var(--red); }
    .kpi-value.green { color: var(--green); }

    /* ── PANEL ── */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      animation: fadeUp .5s .14s cubic-bezier(.22,1,.36,1) both;
    }
    .panel-header {
      padding: 20px 28px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title {
      font-size: .85rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
    }
    .panel-header-right { display: flex; align-items: center; gap: 10px; }
    .tx-pill {
      font-size: .68rem; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 99px; padding: 4px 12px;
    }
    /* Bouton + Ajouter */
    .add-btn {
      font-family: 'Syne', sans-serif; font-size: .7rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--bg); background: var(--gold);
      border: none; border-radius: 8px;
      padding: 7px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      transition: opacity .2s, transform .15s;
    }
    .add-btn:hover  { opacity: .88; }
    .add-btn:active { transform: scale(.97); }
    .add-btn svg { flex-shrink: 0; }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 12px 24px; text-align: left;
      font-size: .62rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
      background: var(--surface-2); border-bottom: 1px solid var(--border);
    }
    thead th:last-child { text-align: right; }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    td { padding: 16px 24px; vertical-align: middle; }
    .td-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: .78rem; color: var(--muted); white-space: nowrap;
    }
    .td-desc { font-size: .88rem; font-weight: 600; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .65rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; padding: 4px 11px 4px 8px; border-radius: 6px;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .badge.debit  { background: var(--red-pale);   color: var(--red); }
    .badge.debit  .badge-dot { background: var(--red); }
    .badge.credit { background: var(--green-pale); color: var(--green); }
    .badge.credit .badge-dot { background: var(--green); }
    .td-amount {
      font-family: 'IBM Plex Mono', monospace; font-size: .9rem;
      font-weight: 500; text-align: right; white-space: nowrap;
    }
    .td-amount.debit  { color: var(--red); }
    .td-amount.credit { color: var(--green); }
    /* Bouton supprimer dans chaque ligne */
    .del-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 4px; border-radius: 6px;
      transition: color .15s, background .15s; line-height: 0;
    }
    .del-btn:hover { color: var(--red); background: var(--red-pale); }
    tfoot tr { background: var(--surface-2); border-top: 1px solid var(--border-h); }
    tfoot td { padding: 18px 24px; }
    .tfoot-label {
      font-size: .65rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
    }
    #total-balance {
      font-family: 'IBM Plex Mono', monospace; font-size: 1.1rem;
      font-weight: 500; text-align: right;
    }

    /* ── MODAL OVERLAY ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-h);
      border-radius: 16px;
      width: min(460px, 100%);
      padding: 36px 32px 32px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
      transform: translateY(20px) scale(.97);
      transition: transform .28s cubic-bezier(.22,1,.36,1);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-title {
      font-size: 1rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; margin-bottom: 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-close {
      background: none; border: none; cursor: pointer;
      color: var(--muted); line-height: 0; padding: 4px; border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .modal-close:hover { color: var(--text); background: var(--surface-2); }

    /* Bascule Débité / Crédité */
    .type-toggle {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 20px;
    }
    .type-btn {
      font-family: 'Syne', sans-serif; font-size: .75rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 11px; border-radius: 8px; cursor: pointer;
      border: 1.5px solid var(--border); background: var(--surface-2);
      color: var(--muted); transition: all .18s;
    }
    .type-btn.active-debit  { background: var(--red-pale);   color: var(--red);   border-color: rgba(224,92,92,.35); }
    .type-btn.active-credit { background: var(--green-pale); color: var(--green); border-color: rgba(76,175,125,.35); }

    /* Champs */
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: .65rem; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 7px;
    }
    .field input {
      width: 100%; background: var(--surface-2);
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: 'Syne', sans-serif; font-size: .9rem;
      padding: 11px 14px; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,168,67,.12);
    }
    .field input[type="number"] { font-family: 'IBM Plex Mono', monospace; }
    .field input::placeholder { color: var(--muted); }

    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-cancel {
      flex: 1; font-family: 'Syne', sans-serif; font-size: .78rem; font-weight: 600;
      letter-spacing: .06em; text-transform: uppercase;
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 12px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-cancel:hover { border-color: var(--border-h); color: var(--text); }
    .btn-confirm {
      flex: 2; font-family: 'Syne', sans-serif; font-size: .78rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      background: var(--gold); border: none; color: var(--bg);
      border-radius: 8px; padding: 12px; cursor: pointer;
      transition: opacity .15s, transform .12s;
    }
    .btn-confirm:hover  { opacity: .88; }
    .btn-confirm:active { transform: scale(.98); }

    /* Toast de confirmation */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--surface); border: 1px solid var(--border-h);
      border-radius: 99px; padding: 10px 22px;
      font-size: .78rem; font-weight: 600; letter-spacing: .04em;
      color: var(--green); box-shadow: 0 8px 32px rgba(0,0,0,.4);
      opacity: 0; pointer-events: none; z-index: 200;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="brand">Hello<em>Anto</em></div>
    <div class="header-right">
      <div class="date-pill" id="today-date">—</div>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="summary">
    <div class="kpi k-balance">
      <div class="kpi-label">Solde final</div>
      <div class="kpi-value gold" id="summary-balance">—</div>
    </div>
    <div class="kpi k-debit">
      <div class="kpi-label">Débits</div>
      <div class="kpi-value red" id="summary-debits">—</div>
    </div>
    <div class="kpi k-credit">
      <div class="kpi-label">Crédits</div>
      <div class="kpi-value green" id="summary-credits">—</div>
    </div>
    <div class="kpi k-count">
      <div class="kpi-label">Opérations</div>
      <div class="kpi-value" id="summary-count">—</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Transactions</span>
      <div class="panel-header-right">
        <span class="tx-pill" id="tx-count">—</span>
        <button class="add-btn" onclick="openModal()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Ajouter
        </button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Type</th>
          <th>Montant</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
      <tfoot>
        <tr>
          <td colspan="4" class="tfoot-label">Solde final</td>
          <td id="total-balance">—</td>
        </tr>
      </tfoot>
    </table>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">
      Nouvelle transaction
      <button class="modal-close" onclick="closeModal()" aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Bascule type -->
    <div class="type-toggle">
      <button class="type-btn active-debit" id="btn-debit"  onclick="setType('Débité')">⬇ Débité</button>
      <button class="type-btn"              id="btn-credit" onclick="setType('Crédité')">⬆ Crédité</button>
    </div>

    <div class="field">
      <label for="inp-desc">Description</label>
      <input type="text" id="inp-desc" placeholder="Ex: Carrefour - Saran" autocomplete="off">
    </div>
    <div class="field">
      <label for="inp-montant">Montant (€)</label>
      <input type="number" id="inp-montant" placeholder="0.00" min="0.01" step="0.01">
    </div>
    <div class="field">
      <label for="inp-date">Date</label>
      <input type="date" id="inp-date">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel"  onclick="closeModal()">Annuler</button>
      <button class="btn-confirm" onclick="addTransaction()">Confirmer</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // ── Données (persistées dans localStorage) ──────────────────
  const STORAGE_KEY = 'hellanto_transactions';

  const defaultTransactions = [
    { date: "2026-04-16", description: "Victorine - Orléans",  type: "Débité",  montant: 11.80 },
    { date: "2026-04-25", description: "Market Frais - Saran",  type: "Débité",  montant: 2.18  },
    { date: "2026-04-26", description: "Patapain - Ormes",      type: "Débité",  montant: 4.80  },
    { date: "2026-05-09", description: "Retrait en Banque",     type: "Crédité", montant: 51.05 },
    { date: "2026-05-30", description: "Carrefour - Saran",     type: "Débité",  montant: 8.33  },
  ];

  function loadTransactions() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : defaultTransactions;
    } catch { return defaultTransactions; }
  }

  function saveTransactions(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let transactions = loadTransactions();

  // ── Helpers ──────────────────────────────────────────────────
  const fmt = n =>
    n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';

  const fmtDate = iso => {
    const [y, m, d] = iso.split('-');
    return new Date(y, m - 1, d)
      .toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  // ── Rendu complet ─────────────────────────────────────────────
  function render() {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';
    let total = 0, totalDebits = 0, totalCredits = 0;

    transactions.forEach((item, i) => {
      const isDebit = item.type === 'Débité';
      const montant = parseFloat(item.montant);
      if (isDebit) { total -= montant; totalDebits += montant; }
      else         { total += montant; totalCredits += montant; }

      const tr = document.createElement('tr');
      tr.style.animation = `rowIn .35s ${.05 + i * .04}s cubic-bezier(.22,1,.36,1) both`;
      tr.innerHTML = `
        <td class="td-date">${fmtDate(item.date)}</td>
        <td class="td-desc">${item.description}</td>
        <td><span class="badge ${isDebit ? 'debit' : 'credit'}"><span class="badge-dot"></span>${item.type}</span></td>
        <td class="td-amount ${isDebit ? 'debit' : 'credit'}">${isDebit ? '−' : '+'} ${fmt(montant)}</td>
        <td style="text-align:right">
          <button class="del-btn" onclick="deleteTransaction(${i})" title="Supprimer">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
              <path d="M2 4h11M6 4V2.5a.5.5 0 01.5-.5h2a.5.5 0 01.5.5V4M5 4l.5 8M10 4l-.5 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    // KPI
    const balEl = document.getElementById('summary-balance');
    balEl.textContent = (total < 0 ? '− ' : '') + fmt(Math.abs(total));
    balEl.className   = 'kpi-value ' + (total < 0 ? 'red' : 'gold');
    document.getElementById('summary-debits').textContent  = '− ' + fmt(totalDebits);
    document.getElementById('summary-credits').textContent = '+ ' + fmt(totalCredits);
    document.getElementById('summary-count').textContent   = transactions.length;
    document.getElementById('tx-count').textContent =
      transactions.length + ' opération' + (transactions.length > 1 ? 's' : '');

    // Solde pied
    const totalEl = document.getElementById('total-balance');
    totalEl.textContent = (total < 0 ? '− ' : '+ ') + fmt(Math.abs(total));
    totalEl.style.color = total < 0 ? 'var(--red)' : 'var(--green)';
  }

  // ── Date du jour ──────────────────────────────────────────────
  document.getElementById('today-date').textContent =
    new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  // ── Modal ─────────────────────────────────────────────────────
  let selectedType = 'Débité';

  function openModal() {
    // Pré-remplir la date du jour
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('inp-date').value = today;
    document.getElementById('inp-desc').value = '';
    document.getElementById('inp-montant').value = '';
    setType('Débité');
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('inp-desc').focus(), 120);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  function setType(type) {
    selectedType = type;
    document.getElementById('btn-debit').className  = 'type-btn' + (type === 'Débité'  ? ' active-debit'  : '');
    document.getElementById('btn-credit').className = 'type-btn' + (type === 'Crédité' ? ' active-credit' : '');
  }

  function addTransaction() {
    const desc    = document.getElementById('inp-desc').value.trim();
    const montant = parseFloat(document.getElementById('inp-montant').value);
    const date    = document.getElementById('inp-date').value;

    if (!desc)           { shake('inp-desc');    return; }
    if (!montant || montant <= 0) { shake('inp-montant'); return; }
    if (!date)           { shake('inp-date');    return; }

    transactions.push({ date, description: desc, type: selectedType, montant });

    // Trier par date décroissante
    transactions.sort((a, b) => b.date.localeCompare(a.date));

    saveTransactions(transactions);
    render();
    closeModal();
    showToast('Transaction ajoutée ✓');
  }

  // ── Suppression ───────────────────────────────────────────────
  function deleteTransaction(index) {
    transactions.splice(index, 1);
    saveTransactions(transactions);
    render();
    showToast('Transaction supprimée');
  }

  // ── Shake sur champ invalide ──────────────────────────────────
  function shake(id) {
    const el = document.getElementById(id);
    el.style.borderColor = 'var(--red)';
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.style.animation = 'shakeX .3s ease';
    el.focus();
    setTimeout(() => { el.style.borderColor = ''; el.style.animation = ''; }, 700);
  }

  // ── Toast ─────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ── Clavier ───────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) addTransaction();
  });

  // ── Déconnexion ───────────────────────────────────────────────
  function logout() {
    sessionStorage.removeItem('isLoggedIn');
    window.location.href = 'index.html';
  }

  // ── Init ──────────────────────────────────────────────────────
  render();
</script>

<style>
  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    20%,60%  { transform: translateX(-5px); }
    40%,80%  { transform: translateX(5px); }
  }
</style>
</body>
</html>
